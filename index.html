<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get in touch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF6EF;
    --ink: #1F2A24;
    --ink-soft: #5B665F;
    --rule: #D8CFC0;
    --accent: #2F6F52;
    --accent-dark: #234F3B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 48px 20px;
  }

  main {
    width: 100%;
    max-width: 460px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.15;
    margin: 0 0 8px;
  }

  p.lede {
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 28px;
    max-width: 38ch;
  }

  hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 0 0 32px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .field { margin-bottom: 22px; }

  input {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 8px 2px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus {
    border-bottom-color: var(--accent);
  }

  input::placeholder { color: #A9A192; }

  button {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--paper);
    background: var(--accent);
    border: none;
    border-radius: 4px;
    padding: 13px 18px;
    margin-top: 12px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: default; }

  #result {
    margin-top: 22px;
    font-size: 14px;
    line-height: 1.6;
    padding: 14px 16px;
    border-radius: 4px;
    display: none;
  }

  #result.show { display: block; }
  #result.ok { background: #EAF2EC; color: var(--accent-dark); }
  #result.err { background: #F6E9E6; color: #8C3A2C; }

  #result .id {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
  }
</style>
</head>
<body>
  <main>
    <h1>Let's start the conversation</h1>
    <p class="lede">Tell us a little about what you need, and we'll get back to you shortly.</p>
    <hr>

    <form id="leadForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Jordan Patel" required>
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" placeholder="+91 98765 43210" required>
      </div>
      <div class="field">
        <label for="email">Email (optional)</label>
        <input type="email" id="email" placeholder="jordan@email.com">
      </div>
      <button type="submit" id="submitBtn">Send details</button>
    </form>

    <div id="result"></div>
  </main>

  <script>
    // 👇 Paste your PUBLIC Apps Script Web App URL here (the "Anyone" access one)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhjPPrsvKCj_8S42Z9GKFMQ3LzGhuIvVTBnt8k2V8jlY6mh0P1Yg_EWGCJDYdgl0U_/exec";

    const form = document.getElementById('leadForm');
    const btn = document.getElementById('submitBtn');
    const resultEl = document.getElementById('result');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Sending…';
      resultEl.className = '';

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'submit',
          name: document.getElementById('name').value,
          phone: document.getElementById('phone').value,
          email: document.getElementById('email').value
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.success) {
            resultEl.innerHTML = "You're on our list. Your reference ID is <span class=\"id\">" + res.customerId + "</span>. We'll be in touch soon.";
            resultEl.className = 'show ok';
            form.reset();
            btn.textContent = 'Send details';
            btn.disabled = false;
          } else {
            resultEl.textContent = 'Something went wrong: ' + res.error;
            resultEl.className = 'show err';
            btn.textContent = 'Send details';
            btn.disabled = false;
          }
        })
        .catch(function (err) {
          resultEl.textContent = 'Something went wrong: ' + err;
          resultEl.className = 'show err';
          btn.textContent = 'Send details';
          btn.disabled = false;
        });
    });
  </script>
</body>
</html>
