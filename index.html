<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get in touch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF6EF;
    --ink: #1F2A24;
    --ink-soft: #5B665F;
    --rule: #D8CFC0;
    --accent: #2F6F52;
    --accent-dark: #234F3B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 48px 20px;
  }

  main { width: 100%; max-width: 460px; }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.15;
    margin: 0 0 8px;
  }

  p.lede {
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 28px;
    max-width: 38ch;
  }

  hr { border: none; border-top: 1px solid var(--rule); margin: 0 0 32px; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .field { margin-bottom: 22px; }

  input, select, textarea {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 8px 2px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  textarea { min-height: 70px; resize: vertical; }

  input:focus, select:focus, textarea:focus { border-bottom-color: var(--accent); }
  input::placeholder, textarea::placeholder { color: #A9A192; }

  button {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--paper);
    background: var(--accent);
    border: none;
    border-radius: 4px;
    padding: 13px 18px;
    margin-top: 12px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: default; }

  #result {
    margin-top: 22px;
    font-size: 14px;
    line-height: 1.6;
    padding: 14px 16px;
    border-radius: 4px;
    display: none;
  }

  #result.show { display: block; }
  #result.ok { background: #EAF2EC; color: var(--accent-dark); }
  #result.err { background: #F6E9E6; color: #8C3A2C; }
  #result .id { font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; }

  #loadingNote { color: var(--ink-soft); font-size: 14px; }
</style>
</head>
<body>
  <main>
    <h1>Let's start the conversation</h1>
    <p class="lede">Tell us a little about what you need, and we'll get back to you shortly.</p>
    <hr>

    <p id="loadingNote">Loading form…</p>
    <form id="leadForm" style="display:none;">
      <div id="fieldsContainer"></div>
      <!-- Honeypot: invisible to real people, but bots that auto-fill every field will fill this too -->
      <input type="text" id="hp_field" name="hp_field" style="position:absolute; left:-9999px;" tabindex="-1" autocomplete="off">
      <button type="submit" id="submitBtn">Send details</button>
    </form>

    <div id="result"></div>
  </main>

  <script>
    // 👇 Paste your PUBLIC Apps Script Web App URL here (the "Anyone" access one)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhjPPrsvKCj_8S42Z9GKFMQ3LzGhuIvVTBnt8k2V8jlY6mh0P1Yg_EWGCJDYdgl0U_/exec";

    let currentFields = [];
    const pageLoadedAt = Date.now();
    const form = document.getElementById('leadForm');
    const btn = document.getElementById('submitBtn');
    const resultEl = document.getElementById('result');
    const loadingNote = document.getElementById('loadingNote');

    function loadFields() {
      fetch(SCRIPT_URL + '?action=fields')
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.success && res.fields.length > 0) {
            currentFields = res.fields;
            renderFields(currentFields);
            loadingNote.style.display = 'none';
            form.style.display = 'block';
          } else {
            loadingNote.textContent = 'This form has no questions configured yet.';
          }
        })
        .catch(function () {
          loadingNote.textContent = 'Could not load the form. Please refresh the page.';
        });
    }

    function renderFields(fields) {
      const container = document.getElementById('fieldsContainer');
      container.innerHTML = '';
      fields.forEach(function (f) {
        const wrap = document.createElement('div');
        wrap.className = 'field';

        const label = document.createElement('label');
        label.textContent = f.label + (f.required ? ' *' : '');
        wrap.appendChild(label);

        let input;
        if (f.type === 'textarea') {
          input = document.createElement('textarea');
        } else if (f.type === 'dropdown') {
          input = document.createElement('select');
          f.options.forEach(function (opt) {
            const o = document.createElement('option');
            o.value = opt;
            o.textContent = opt;
            input.appendChild(o);
          });
        } else {
          input = document.createElement('input');
          input.type = (f.type === 'email' || f.type === 'tel') ? f.type : 'text';
          if (f.type === 'tel') {
            input.pattern = '[0-9+()\\s-]{7,20}';
            input.title = 'Enter a valid phone number';
          }
        }

        input.dataset.fieldLabel = f.label;
        if (f.required) input.required = true;
        wrap.appendChild(input);
        container.appendChild(wrap);
      });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Sending…';
      resultEl.className = '';

      const payload = { action: 'submit' };
      payload.hp_field = document.getElementById('hp_field').value;
      payload.loadedAt = pageLoadedAt;
      currentFields.forEach(function (f) {
        const el = document.querySelector('[data-field-label="' + f.label.replace(/"/g, '\\"') + '"]');
        payload[f.label] = el ? el.value : '';
      });

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.success) {
            resultEl.innerHTML = "You're on our list. Your reference ID is <span class=\"id\">" + res.customerId + "</span>. We'll be in touch soon.";
            resultEl.className = 'show ok';
            form.reset();
          } else {
            resultEl.textContent = 'Something went wrong: ' + res.error;
            resultEl.className = 'show err';
          }
          btn.textContent = 'Send details';
          btn.disabled = false;
        })
        .catch(function (err) {
          resultEl.textContent = 'Something went wrong: ' + err;
          resultEl.className = 'show err';
          btn.textContent = 'Send details';
          btn.disabled = false;
        });
    });

    loadFields();
  </script>
</body>
</html>
