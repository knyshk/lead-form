<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get in touch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF9F6;
    --paper-raised: #FFFFFF;
    --ink: #1A1A1A;
    --ink-soft: #63675A;
    --ink-faint: #A39C8C;
    --rule: #E5E5E5;
    --accent: #3D5A4C;
    --accent-dark: #2B4137;
    --sand: #C4A484;
    --err: #9C4A36;
    --err-bg: #F6ECE7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 56px 20px;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 440px;
    position: relative;
  }

  .blob {
    position: absolute;
    top: -54px;
    right: -70px;
    width: 220px;
    height: 220px;
    z-index: -1;
    pointer-events: none;
  }

  .mark { margin-bottom: 20px; }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.18;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }

  p.lede {
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 32px;
    max-width: 36ch;
  }

  hr { border: none; border-top: 1px solid var(--rule); margin: 0 0 34px; }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
    margin-bottom: 7px;
  }

  .field { margin-bottom: 24px; }

  input, select, textarea {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 9px 2px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  textarea { min-height: 74px; resize: vertical; }

  select {
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7' viewBox='0 0 11 7'><path d='M1 1l4.5 4.5L10 1' fill='none' stroke='%2363675A' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 2px center;
    padding-right: 20px;
  }

  input:focus, select:focus, textarea:focus { border-bottom-color: var(--accent); }
  input::placeholder, textarea::placeholder { color: var(--ink-faint); }

  button {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--paper);
    background: var(--accent);
    border: none;
    border-radius: 3px;
    padding: 14px 18px;
    margin-top: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover:not(:disabled) { background: var(--accent-dark); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.55; cursor: default; }

  #result {
    margin-top: 24px;
    font-size: 14px;
    line-height: 1.65;
    padding: 14px 16px;
    border-radius: 3px;
    border-left: 3px solid transparent;
    display: none;
  }

  #result.show { display: block; }
  #result.ok { background: #EEF3EF; border-left-color: var(--accent); color: var(--accent-dark); }
  #result.err { background: var(--err-bg); border-left-color: var(--err); color: var(--err); }
  #result .id { font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; }

  #loadingNote {
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  #loadingNote::before {
    content: '';
    width: 13px; height: 13px;
    border: 1.6px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #loadingNote::before { animation: none; } }
</style>
</head>
<body>
  <main>
    <svg class="blob" viewBox="0 0 200 200" aria-hidden="true">
      <path d="M45,-58C58,-49,67,-33,71,-15C75,3,73,23,63,39C53,55,35,66,15,70C-5,74,-27,71,-44,60C-61,49,-73,30,-76,10C-79,-11,-73,-33,-59,-48C-45,-63,-23,-71,-1,-70C21,-70,32,-67,45,-58Z"
        transform="translate(100,100)" fill="#3D5A4C" opacity="0.07" />
    </svg>

    <div class="mark">
      <svg width="56" height="44" viewBox="0 0 64 48" fill="none">
        <rect x="4" y="6" width="56" height="38" rx="3" stroke="#1A1A1A" stroke-width="1.6" fill="#FFFFFF"/>
        <path d="M4 8L32 30L60 8" stroke="#1A1A1A" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="32" cy="27" r="8" fill="#3D5A4C"/>
        <path d="M28.5 27c0-2.2 1.6-4 3.5-4M35.5 27c0 2.2-1.6 4-3.5 4" stroke="#FAF9F6" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>Let's start the conversation</h1>
    <p class="lede">Tell us a little about what you need, and we'll get back to you shortly.</p>
    <hr>

    <p id="loadingNote">Loading form…</p>
    <form id="leadForm" style="display:none;">
      <div id="fieldsContainer"></div>
      <!-- Honeypot: invisible to real people, but bots that auto-fill every field will fill this too -->
      <input type="text" id="hp_field" name="hp_field" style="position:absolute; left:-9999px;" tabindex="-1" autocomplete="off">
      <button type="submit" id="submitBtn">Send details</button>
    </form>

    <div id="result"></div>
  </main>

  <script>
    // 👇 Paste your PUBLIC Apps Script Web App URL here (the "Anyone" access one)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhjPPrsvKCj_8S42Z9GKFMQ3LzGhuIvVTBnt8k2V8jlY6mh0P1Yg_EWGCJDYdgl0U_/exec";

    let currentFields = [];
    const pageLoadedAt = Date.now();
    const form = document.getElementById('leadForm');
    const btn = document.getElementById('submitBtn');
    const resultEl = document.getElementById('result');
    const loadingNote = document.getElementById('loadingNote');

    function loadFields() {
      fetch(SCRIPT_URL + '?action=fields')
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.success && res.fields.length > 0) {
            currentFields = res.fields;
            renderFields(currentFields);
            loadingNote.style.display = 'none';
            form.style.display = 'block';
          } else {
            loadingNote.textContent = 'This form has no questions configured yet.';
          }
        })
        .catch(function () {
          loadingNote.textContent = 'Could not load the form. Please refresh the page.';
        });
    }

    function renderFields(fields) {
      const container = document.getElementById('fieldsContainer');
      container.innerHTML = '';
      fields.forEach(function (f) {
        const wrap = document.createElement('div');
        wrap.className = 'field';

        const label = document.createElement('label');
        label.textContent = f.label + (f.required ? ' *' : '');
        wrap.appendChild(label);

        let input;
        if (f.type === 'textarea') {
          input = document.createElement('textarea');
        } else if (f.type === 'dropdown') {
          input = document.createElement('select');
          f.options.forEach(function (opt) {
            const o = document.createElement('option');
            o.value = opt;
            o.textContent = opt;
            input.appendChild(o);
          });
        } else {
          input = document.createElement('input');
          input.type = (f.type === 'email' || f.type === 'tel') ? f.type : 'text';
          if (f.type === 'tel') {
            input.pattern = '[0-9+\\(\\)\\s-]{7,20}';
            input.title = 'Enter a valid phone number';
          }
        }

        input.dataset.fieldLabel = f.label;
        if (f.required) input.required = true;
        wrap.appendChild(input);
        container.appendChild(wrap);
      });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Sending…';
      resultEl.className = '';

      const payload = { action: 'submit' };
      payload.hp_field = document.getElementById('hp_field').value;
      payload.loadedAt = pageLoadedAt;
      currentFields.forEach(function (f) {
        const el = document.querySelector('[data-field-label="' + f.label.replace(/"/g, '\\"') + '"]');
        payload[f.label] = el ? el.value : '';
      });

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.success) {
            resultEl.innerHTML = "You're on our list. Your reference ID is <span class=\"id\">" + res.customerId + "</span>. We'll be in touch soon.";
            resultEl.className = 'show ok';
            form.reset();
          } else {
            resultEl.textContent = 'Something went wrong: ' + res.error;
            resultEl.className = 'show err';
          }
          btn.textContent = 'Send details';
          btn.disabled = false;
        })
        .catch(function (err) {
          resultEl.textContent = 'Something went wrong: ' + err;
          resultEl.className = 'show err';
          btn.textContent = 'Send details';
          btn.disabled = false;
        });
    });

    loadFields();
  </script>
</body>
</html>
